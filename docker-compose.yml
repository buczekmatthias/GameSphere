name: gameshpere

services:
  app:
    user: '1000:1000'
    build:
      context: .
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    container_name: gameshpere-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "composer install --no-interaction &&
             php artisan migrate --force &&
             php-fpm"

  web:
    image: nginx:stable-alpine
    container_name: gameshpere-web
    restart: unless-stopped
    ports:
      - '8000:80'
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - internal
    depends_on:
      - app

  node:
    image: node:24
    user: '1000:1000'
    working_dir: /app
    networks:
      - internal
    volumes:
      - .:/app
    ports:
      - '5173:5173'
    command: sh -c "npm install && npm run dev -- --host"

  postgres:
    image: postgres:18
    user: '1000:1000'
    container_name: gameshpere-postgres
    restart: unless-stopped
    ports:
      - '127.0.0.1:5433:5432'
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgsql_data:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  internal:

volumes:
  pgsql_data:
