name: gameshpere

services:
  app:
    user: '1000:1000'
    build:
      context: .
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    container_name: gameshpere-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'php -r "exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);"']
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  web:
    image: nginx:stable-alpine
    container_name: gameshpere-web
    restart: unless-stopped
    ports:
      - '8000:80'
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - internal
    depends_on:
      app:
        condition: service_healthy
      node:
        condition: service_healthy

  node:
    image: node:24
    user: '1000:1000'
    working_dir: /app
    networks:
      - internal
    volumes:
      - .:/app
    ports:
      - '5173:5173'
    command: sh -c "[ node_modules/.package-lock.json -nt package-lock.json ] || npm install; npm run dev -- --host"
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://localhost:5173/@vite/client > /dev/null || exit 1']
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  postgres:
    image: postgres:18
    user: '1000:1000'
    container_name: gameshpere-postgres
    restart: unless-stopped
    ports:
      - '127.0.0.1:5433:5432'
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgsql_data:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  internal:

volumes:
  pgsql_data:
